[versions]
asm = "9.9.1"
cfr = "0.2.2"
jd-core = "1.1.3"
jetbrains-annotations = "26.1.0"
lombok = "9.4.0"
procyon = "0.6.0"
runtime = "2.0.1"
shadow = "9.4.1"
spotless = "8.4.0"
vineflower = "1.11.2"

[libraries]
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
asm-util = { module = "org.ow2.asm:asm-util", version.ref = "asm" }
cfr = { module = "net.fabricmc:cfr", version.ref = "cfr" }
jd-core = { module = "com.github.java-decompiler:jd-core", version.ref = "jd-core" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }
procyon = { module = "org.bitbucket.mstrobel:procyon-compilertools", version.ref = "procyon" }
vineflower = { module = "org.vineflower:vineflower", version.ref = "vineflower" }

[plugins]
lombok = { id = "io.freefair.lombok", version.ref = "lombok" }
runtime = { id = "org.beryx.runtime", version.ref = "runtime" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
